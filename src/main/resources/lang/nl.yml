# =============================================================================
#  ProVouchers - Nederlandse berichten
#  Ontbrekende sleutels vallen terug op lang/en.yml.
# =============================================================================

prefix: "<gradient:#FFD700:#FF8A00><b>ProVouchers</b></gradient> <dark_gray>»</dark_gray> "

# ---- Commandofeedback -----------------------------------------------------------
command:
  unknown-voucher: "{prefix}<red>Onbekende voucher <yellow>{id}</yellow>."     # {id}
  give:
    needs-target: "{prefix}<red>Voer dit in het spel uit, of geef vanuit de console een doelspeler op."
    usage: "{prefix}<gray>Gebruik: <yellow>/voucher give <id> [aantal] [speler]</yellow>"
    no-target: "{prefix}<red>Geen online speler komt overeen met dat doel."
    success: "{prefix}<green><yellow>{amount}x</yellow> <gold>{voucher}</gold> gegeven aan <yellow>{target}</yellow>."  # {amount} {voucher} {target}
  giveall:
    none-online: "{prefix}<gray>Er zijn geen spelers online."
    none-matched: "{prefix}<gray>Geen online speler heeft die permissie."
    success: "{prefix}<green><yellow>{amount}x</yellow> <gold>{voucher}</gold> gegeven aan <yellow>{count}</yellow> speler(s)."  # {amount} {voucher} {count}
  stashgive:
    success: "{prefix}<green><yellow>{amount}x</yellow> <gold>{voucher}</gold> in de Stash van <yellow>{target}</yellow> geplaatst."  # {amount} {voucher} {target}
    unknown-target: "{prefix}<red>Geen speler met de naam <yellow>{target}</yellow> heeft deze server bezocht."  # {target}
  stash:
    players-only: "{prefix}<red>Alleen spelers kunnen de Stash openen."
  redeem:
    players-only: "{prefix}<red>Alleen spelers kunnen codes inwisselen."
  preview:
    players-only: "{prefix}<red>Alleen spelers kunnen het voorbeeld openen."
  list:
    heading: "{prefix}<gold>Geladen inhoud"
    vouchers: "<gray>  Vouchers (<yellow>{count}</yellow>): {ids}"   # {count} {ids}
    codes: "<gray>  Codes: <yellow>{count}</yellow>"                 # {count}
    none: "<dark_gray>geen"
  reload:
    success: "{prefix}<green><yellow>{vouchers}</yellow> voucher(s) en <yellow>{codes}</yellow> code(s) opnieuw geladen."  # {vouchers} {codes}
    one-success: "{prefix}<green><gold>{id}</gold> opnieuw geladen vanaf schijf."     # {id}
    unknown-file: "{prefix}<red>Geen voucher- of codebestand met de naam <gold>{id}</gold>."  # {id}
    errors: "{prefix}<red>Opnieuw geladen met <yellow>{errors}</yellow> fout(en):"   # {errors}
    error-line: "<red>  - <gray>{error}"                            # {error}
  resetuses:
    success: "{prefix}<green>Alle geregistreerde gebruiken van <gold>{id}</gold> zijn gereset."    # {id}
    success-player: "{prefix}<green>Gebruiken van <gold>{id}</gold> voor <yellow>{target}</yellow> gereset."  # {id} {target}
    failed: "{prefix}<red>Kon de gebruiken niet resetten; opslag is niet beschikbaar."
  fromhand:
    players-only: "{prefix}<red>Alleen spelers kunnen een item vastleggen."
    empty-hand: "{prefix}<red>Houd het item vast dat je wilt vastleggen."
    bad-id: "{prefix}<red><gold>{id}</gold> is geen geldige bestandsnaam (letters, cijfers, - en _)."  # {id}
    exists: "{prefix}<red>Een voucher met de naam <gold>{id}</gold> bestaat al."     # {id}
    created: "{prefix}<green><gold>{id}</gold> aangemaakt en geladen (<yellow>{file}</yellow>)."  # {id} {file}
    cancelled: "{prefix}<gray>Geannuleerd; er is niets weggeschreven."
    failed: "{prefix}<red>Kon dat item niet vastleggen. Probeer het opnieuw."
  import:
    not-found: "{prefix}<red>Onbekende importbron, of de gegevensmap is niet gevonden."
    summary: "{prefix}<green><yellow>{imported}</yellow> geïmporteerd, <yellow>{skipped}</yellow> overgeslagen."  # {imported} {skipped}
    skipped-line: "<red>  - <gray>{line}"     # {line}
    warning-line: "<yellow>  ! <gray>{line}"  # {line}
  doctor:
    heading: "{prefix}<gold>Diagnose"
  help:
    heading: "{prefix}<gold>Commando's"
    hover: "<gray>Klik om het commando in de chat te plaatsen"
    descriptions:
      give: "Geef een voucher aan een speler"
      giveall: "Geef een voucher aan alle online spelers"
      redeem: "Wissel een code in"
      preview: "Blader door vouchers in een menu"
      list: "Toon geladen vouchers en codes"
      reload: "Herlaad alles, of één bestand op id"
      resetuses: "Reset geregistreerde gebruiken van een voucher of code"
      fromhand: "Leg het vastgehouden item vast als nieuwe voucher"
      import: "Importeer vouchers uit CrazyVouchers"
      doctor: "Toon een diagnoserapport"
      help: "Toon dit hulpmenu"

# ---- Een voucher (item) inwisselen -------------------------------------------------
redeem:
  not-configured: "<red>Deze voucher is niet meer geconfigureerd."
  unredeemable: "<red>Deze voucher kan niet worden ingewisseld."
  disabled: "<red>Deze voucher is momenteel uitgeschakeld."
  not-owner: "<red>Deze voucher is van iemand anders."
  expired: "<red>Deze voucher is verlopen."
  not-yet-active: "<red>Deze voucher is nog niet actief."
  wrong-gamemode: "<red>Je kunt geen vouchers inwisselen in deze spelmodus."
  cooldown: "<red>Je moet {seconds}s wachten voordat je dit opnieuw kunt inwisselen."   # {seconds}
  already-redeemed: "<red>Deze voucher is al ingewisseld."
  use-limit: "<red>Je hebt deze voucher al het maximale aantal keren ingewisseld."
  global-limit: "<red>Deze voucher heeft zijn globale inwissellimiet bereikt."
  verify-failed: "<red>Kon deze voucher niet verifiëren. Probeer het opnieuw."
  requirements-not-met: "<red>Je voldoet niet aan de vereisten om dit in te wisselen."
  opened: "<green>{count}x {voucher} geopend."   # {count} {voucher} (batch-open)
  confirm: "{prefix}<yellow>Klik binnen {seconds}s nogmaals om het inwisselen van <gold>{voucher}</gold> te bevestigen."   # {seconds} {voucher}

# ---- Een code inwisselen ------------------------------------------------------------
code:
  unknown: "<red>Onbekende code."
  disabled: "<red>Deze code is momenteel uitgeschakeld."
  expired: "<red>Deze code is verlopen."
  not-yet-active: "<red>Deze code is nog niet actief."
  wrong-gamemode: "<red>Je kunt geen codes inwisselen in deze spelmodus."
  already-redeemed: "<red>Je hebt deze code al ingewisseld."
  global-limit: "<red>Deze code heeft zijn globale gebruikslimiet bereikt."
  verify-failed: "<red>Kon de code niet verifiëren. Probeer het opnieuw."
  redeemed: "<green>Code ingewisseld."

# ---- Soulbound-beperkingen (getoond in de actiebalk) ----------------------------------
# ---- The Stash (virtual vouchers claimed from /stash) ----
stash:
  claimed: "<green><gold>{voucher}</gold> geclaimd."                # {voucher}
  already-claimed: "<red>Die beloning is niet meer beschikbaar."
  not-configured: "<red>De voucher van die beloning bestaat niet meer."
  empty: "<gray>Je Stash is leeg."
  notify: "{prefix}<gold>Je hebt <yellow>{count}</yellow> beloning(en) in je Stash. <gray>Open het met <yellow>/stash</yellow>."  # {count}
  claim-all: "<green>Alles claimen"
  claimed-all: "<green><yellow>{count}</yellow> beloning(en) geclaimd."  # {count}
  lore:
    amount: "<gray>Aantal: <yellow>{amount}"  # {amount}
    expires: "<gray>Verloopt over <yellow>{time}"  # {time}
    claim: "<green>Klik om te claimen"

soulbound:
  no-drop: "<red>Deze voucher is aan je gebonden en kan niet worden weggegooid."
  no-container: "<red>Deze voucher is aan je gebonden en kan niet worden opgeborgen."

# ---- Stafmeldingen (spelers met provouchers.notify) ----------------------------------
staff:
  duplicate-alert: "<gold>[ProVouchers] <yellow>{player} probeerde een duplicaat van '{voucher}' in te wisselen in {world}."   # {player} {voucher} {world}

# ---- Standaard weigeringsberichten van voorwaarden ("deny:" op de voucher gaat voor) --
condition:
  permission: "<red>Je hebt hier geen toestemming voor."
  world: "<red>Je bent in de verkeerde wereld."
  gamemode: "<red>Verkeerde spelmodus."
  exp: "<red>Je hebt level {level} nodig."   # {level}
  expiry: "<red>Dit is verlopen."
  playtime: "<red>Je hebt {time} speeltijd nodig."   # {time}
  item: "<red>Je hebt {amount}x {material} in je inventaris nodig."   # {amount} {material}
  advancement: "<red>Je hebt de vereiste vooruitgang nog niet behaald."
  requirement-not-met: "<red>Niet aan de vereiste voldaan."
  statistic-unreadable: "<red>Kon die statistiek niet lezen."
  economy-unavailable: "<red>Economie is niet beschikbaar."
  economy: "<red>Je kunt dit niet betalen."
  rank: "<red>Je mist de vereiste rang."
  region-unavailable: "<red>Regio-ondersteuning is niet beschikbaar."
  region: "<red>Je bent niet in de vereiste regio."
