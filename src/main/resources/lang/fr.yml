# =============================================================================
#  ProVouchers - Messages en francais
#  Toute cle absente retombe sur lang/en.yml.
# =============================================================================

prefix: "<gradient:#FFD700:#FF8A00><b>ProVouchers</b></gradient> <dark_gray>»</dark_gray> "

# ---- Retour des commandes -----------------------------------------------------
command:
  unknown-voucher: "{prefix}<red>Bon <yellow>{id}</yellow> inconnu."     # {id}
  give:
    needs-target: "{prefix}<red>Exécutez cette commande en jeu, ou précisez un joueur cible depuis la console."
    usage: "{prefix}<gray>Utilisation : <yellow>/voucher give <id> [quantité] [joueur]</yellow>"
    no-target: "{prefix}<red>Aucun joueur en ligne ne correspond à cette cible."
    success: "{prefix}<green><yellow>{amount}x</yellow> <gold>{voucher}</gold> donné(s) à <yellow>{target}</yellow>."  # {amount} {voucher} {target}
  giveall:
    none-online: "{prefix}<gray>Aucun joueur en ligne à qui donner."
    none-matched: "{prefix}<gray>Aucun joueur en ligne n'a cette permission."
    success: "{prefix}<green><yellow>{amount}x</yellow> <gold>{voucher}</gold> donné(s) à <yellow>{count}</yellow> joueur(s)."  # {amount} {voucher} {count}
  redeem:
    players-only: "{prefix}<red>Seuls les joueurs peuvent utiliser des codes."
  preview:
    players-only: "{prefix}<red>Seuls les joueurs peuvent ouvrir l'aperçu."
  list:
    heading: "{prefix}<gold>Contenu chargé"
    vouchers: "<gray>  Bons (<yellow>{count}</yellow>) : {ids}"   # {count} {ids}
    codes: "<gray>  Codes : <yellow>{count}</yellow>"             # {count}
    none: "<dark_gray>aucun"
  reload:
    success: "{prefix}<green><yellow>{vouchers}</yellow> bon(s) et <yellow>{codes}</yellow> code(s) rechargés."  # {vouchers} {codes}
    one-success: "{prefix}<green><gold>{id}</gold> rechargé depuis le disque."        # {id}
    unknown-file: "{prefix}<red>Aucun fichier de bon ou de code nommé <gold>{id}</gold>."  # {id}
    errors: "{prefix}<red>Rechargé avec <yellow>{errors}</yellow> erreur(s) :"   # {errors}
    error-line: "<red>  - <gray>{error}"                            # {error}
  resetuses:
    success: "{prefix}<green>Toutes les utilisations enregistrées de <gold>{id}</gold> ont été réinitialisées."  # {id}
    success-player: "{prefix}<green>Utilisations de <gold>{id}</gold> réinitialisées pour <yellow>{target}</yellow>."  # {id} {target}
    failed: "{prefix}<red>Impossible de réinitialiser les utilisations, le stockage est indisponible."
  fromhand:
    players-only: "{prefix}<red>Seuls les joueurs peuvent capturer un objet."
    empty-hand: "{prefix}<red>Tenez l'objet à capturer."
    bad-id: "{prefix}<red><gold>{id}</gold> n'est pas un nom de fichier valide (lettres, chiffres, - et _)."  # {id}
    exists: "{prefix}<red>Un bon nommé <gold>{id}</gold> existe déjà."     # {id}
    created: "{prefix}<green><gold>{id}</gold> créé et chargé (<yellow>{file}</yellow>)."  # {id} {file}
    cancelled: "{prefix}<gray>Annulé, rien n'a été écrit."
    failed: "{prefix}<red>Impossible de capturer cet objet. Veuillez réessayer."
  import:
    not-found: "{prefix}<red>Source d'import inconnue, ou son dossier de données est introuvable."
    summary: "{prefix}<green><yellow>{imported}</yellow> importé(s), <yellow>{skipped}</yellow> ignoré(s)."  # {imported} {skipped}
    skipped-line: "<red>  - <gray>{line}"     # {line}
    warning-line: "<yellow>  ! <gray>{line}"  # {line}
  doctor:
    heading: "{prefix}<gold>Diagnostic"
  help:
    heading: "{prefix}<gold>Commandes"
    hover: "<gray>Cliquez pour insérer la commande dans le chat"
    descriptions:
      give: "Donner un bon à un joueur"
      giveall: "Donner un bon à tous les joueurs en ligne"
      redeem: "Utiliser un code"
      preview: "Parcourir les bons dans un menu"
      list: "Lister les bons et codes chargés"
      reload: "Tout recharger, ou un seul fichier par id"
      resetuses: "Réinitialiser les utilisations d'un bon ou d'un code"
      fromhand: "Capturer l'objet tenu comme nouveau bon"
      import: "Importer les bons depuis CrazyVouchers"
      doctor: "Afficher un rapport de diagnostic"
      help: "Afficher ce menu d'aide"

# ---- Utilisation d'un bon (objet) ----------------------------------------------
redeem:
  not-configured: "<red>Ce bon n'est plus configuré."
  unredeemable: "<red>Ce bon ne peut pas être utilisé."
  disabled: "<red>Ce bon est actuellement désactivé."
  not-owner: "<red>Ce bon appartient à quelqu'un d'autre."
  expired: "<red>Ce bon a expiré."
  not-yet-active: "<red>Ce bon n'est pas encore actif."
  wrong-gamemode: "<red>Vous ne pouvez pas utiliser de bons dans ce mode de jeu."
  cooldown: "<red>Vous devez attendre {seconds}s avant de pouvoir réutiliser ceci."   # {seconds}
  already-redeemed: "<red>Ce bon a déjà été utilisé."
  use-limit: "<red>Vous avez utilisé ce bon le nombre maximal de fois."
  global-limit: "<red>Ce bon a atteint sa limite globale d'utilisation."
  verify-failed: "<red>Impossible de vérifier ce bon. Veuillez réessayer."
  requirements-not-met: "<red>Vous ne remplissez pas les conditions pour utiliser ceci."
  opened: "<green>{count}x {voucher} ouvert(s)."   # {count} {voucher} (batch-open)
  confirm: "{prefix}<yellow>Cliquez à nouveau dans les {seconds}s pour confirmer l'utilisation de <gold>{voucher}</gold>."   # {seconds} {voucher}

# ---- Utilisation d'un code ------------------------------------------------------
code:
  unknown: "<red>Code inconnu."
  disabled: "<red>Ce code est actuellement désactivé."
  expired: "<red>Ce code a expiré."
  not-yet-active: "<red>Ce code n'est pas encore actif."
  wrong-gamemode: "<red>Vous ne pouvez pas utiliser de codes dans ce mode de jeu."
  already-redeemed: "<red>Vous avez déjà utilisé ce code."
  global-limit: "<red>Ce code a atteint sa limite d'utilisation globale."
  verify-failed: "<red>Impossible de vérifier le code. Veuillez réessayer."
  redeemed: "<green>Code utilisé."

# ---- Restrictions soulbound (affichées dans la barre d'action) ------------------
soulbound:
  no-drop: "<red>Ce bon vous est lié et ne peut pas être jeté."
  no-container: "<red>Ce bon vous est lié et ne peut pas être rangé."

# ---- Alertes du staff (joueurs avec provouchers.notify) -------------------------
staff:
  duplicate-alert: "<gold>[ProVouchers] <yellow>{player} a tenté d'utiliser un duplicata de '{voucher}' dans {world}."   # {player} {voucher} {world}

# ---- Messages de refus par défaut des conditions ("deny:" du bon les remplace) ----
condition:
  permission: "<red>Vous n'avez pas la permission."
  world: "<red>Vous êtes dans le mauvais monde."
  gamemode: "<red>Mauvais mode de jeu."
  exp: "<red>Vous devez être niveau {level}."   # {level}
  expiry: "<red>Ceci a expiré."
  playtime: "<red>Vous devez avoir {time} de temps de jeu."   # {time}
  item: "<red>Vous devez avoir {amount}x {material} dans votre inventaire."   # {amount} {material}
  advancement: "<red>Vous n'avez pas débloqué le progrès requis."
  requirement-not-met: "<red>Condition non remplie."
  statistic-unreadable: "<red>Impossible de lire cette statistique."
  economy-unavailable: "<red>L'économie est indisponible."
  economy: "<red>Vous n'avez pas assez d'argent."
  rank: "<red>Vous n'avez pas le rang requis."
  region-unavailable: "<red>La gestion des régions est indisponible."
  region: "<red>Vous n'êtes pas dans la région requise."
