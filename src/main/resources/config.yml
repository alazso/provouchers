# ProVouchers configuration.

locale:
  # Language for plugin messages. ProVouchers ships English (lang/en.yml). To translate,
  # copy it to lang/<code>.yml (e.g. lang/de.yml), translate the values, and either set
  # "default" to that code or leave per-player on. Missing keys fall back to English, so a
  # partial translation never shows a blank line. Editing a lang file is picked up by
  # /voucher reload; changing the settings below needs a server restart.
  default: en
  # When true, each player sees messages in their Minecraft client language if a matching
  # lang/<code>.yml exists, otherwise the default above. Console always uses the default.
  per-player: true

storage:
  # Backend: sqlite | mysql | mariadb | postgres
  # SQLite is file-based and needs no extra setup; the others connect to a server.
  backend: sqlite
  # The settings below are used only by the networked backends.
  host: localhost
  port: 5432
  database: provouchers
  username: provouchers
  password: ""
  pool-size: 10

anti-dupe:
  # Anti-dupe is chosen per voucher. Set "stackable: false" on a voucher to stamp
  # each item with a unique id: duplicates are caught, but those items do not stack.
  # Stackable vouchers (the default) stack freely and are not dupe-tracked.
  #
  # When a duplicate voucher is detected on redeem, remove the item instead of
  # returning it to the player.
  remove-on-discovery: true
  warning:
    # When a duplicate is returned (remove-on-discovery: false), append a warning
    # line to its lore so the item is visibly marked.
    enabled: false
    text: "<red>This item has been duplicated"
  notify:
    # Alert staff (players with provouchers.notify) when a duplicate voucher is caught.
    # The message itself is the "staff.duplicate-alert" key in the language file.
    enabled: true

redeem:
  # Left-click a held voucher to preview its rewards in a GUI.
  left-click-preview: true
  # When batch-opening a stack (shift-right-click), suppress the per-item reward
  # feedback (messages, titles, sounds) and show one summary line instead of many.
  batch-open-quiet: true
  # Vouchers with "two-step-authentication: true" need a confirmation click; this is
  # how many seconds that confirmation stays valid.
  confirm-window-seconds: 5
  # How the confirmation is asked: "chat" (click again after a chat prompt) or
  # "gui" (a confirm/cancel menu showing the voucher).
  confirm-style: chat

# Vouchers given automatically to a player joining for the first time.
# Requires a restart to enable or disable; the listed ids resolve at join time.
#auto-give:
#  first-join:
#    - welcome_crate

# Cooldown tiers: permission-based multipliers applied to every voucher cooldown.
# A player with provouchers.cooldown.<tier> gets that tier's multiplier; holding
# several, the lowest wins. 0 removes the cooldown. Changing tiers needs a restart.
#cooldown:
#  tiers:
#    vip: 0.5
#    mvp: 0.0

# The Stash: virtual (itemless) vouchers a player claims from a menu (/stash).
# Gives to offline players and overflow can land here instead of being lost.
# Changing these needs a restart, except overflow, which /voucher reload applies.
stash:
  enabled: true
  command-aliases: [ rewards ]
  title: "<gradient:#FFD700:#FF8A00>Your Stash"
  rows: 6                    # menu height, 1 to 6
  notify-on-join: true       # tell a joining player when rewards are waiting
  expire-after: ""           # entries lapse after this (e.g. 30d); blank = never
  overflow: drop             # when a give does not fit: drop the items, or stash them

# Named Discord webhooks for the "discord: @<name> <message>" reward, so a voucher
# references a name instead of pasting the secret URL into its file. Fill in the URLs
# and add as many as you like. A reward can also use an inline webhook URL directly.
webhooks:
  announce: ""
  staff: ""

metrics:
  # Submit anonymous usage statistics (bStats and FastStats).
  # Set to false to opt out entirely.
  enabled: true
