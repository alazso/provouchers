# ProVouchers configuration.

locale:
  # Language for plugin messages. ProVouchers ships English (lang/en.yml). To translate,
  # copy it to lang/<code>.yml (e.g. lang/de.yml), translate the values, and either set
  # "default" to that code or leave per-player on. Missing keys fall back to English, so a
  # partial translation never shows a blank line. Editing a lang file is picked up by
  # /voucher reload; changing the settings below needs a server restart.
  default: en
  # When true, each player sees messages in their Minecraft client language if a matching
  # lang/<code>.yml exists, otherwise the default above. Console always uses the default.
  per-player: true

storage:
  # Backend: sqlite | mysql | mariadb | postgres
  # SQLite is file-based and needs no extra setup; the others connect to a server.
  backend: sqlite
  # The settings below are used only by the networked backends.
  host: localhost
  port: 5432
  database: provouchers
  username: provouchers
  password: ""
  pool-size: 10

anti-dupe:
  # Anti-dupe is chosen per voucher. Set "stackable: false" on a voucher to stamp
  # each item with a unique id: duplicates are caught, but those items do not stack.
  # Stackable vouchers (the default) stack freely and are not dupe-tracked.
  #
  # When a duplicate voucher is detected on redeem, remove the item instead of
  # returning it to the player.
  remove-on-discovery: true
  warning:
    # When a duplicate is returned (remove-on-discovery: false), append a warning
    # line to its lore so the item is visibly marked.
    enabled: false
    text: "<red>This item has been duplicated"

metrics:
  # Submit anonymous usage statistics (bStats and FastStats).
  # Set to false to opt out entirely.
  enabled: true
