name: Publish to Modrinth

# Runs after a GitHub release is published (the release workflow does that on a
# v* tag). mc-publish reads the release's jar asset, name, version, and notes, and
# creates a matching version on Modrinth.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  modrinth:
    name: Upload to Modrinth
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # ProVouchers (https://modrinth.com/plugin/provouchers)
          modrinth-id: iOogVoaR
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # The jar attached to the GitHub release by release.yml.
          files: provouchers-*.jar

          # Matches the project's configured platforms.
          loaders: |
            paper
            folia
            purpur
          game-versions: |
            26.1
            26.1.1
            26.1.2

          # Strata is a required dependency, but the public "strata" Modrinth slug
          # is an unrelated project. Set this to the Strata library's real Modrinth
          # project id and uncomment it, or leave the dependency set on the project page.
          # dependencies: |
          #   <strata-modrinth-id>(required)

          # Version name, number, changelog, and release/beta type are taken from
          # the GitHub release automatically.
